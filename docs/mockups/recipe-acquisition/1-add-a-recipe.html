<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshUp 1: add a recipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// theme.extend copied from the attached tailwind.config.js, token names unchanged
tailwind.config = {
  theme: { extend: {
    colors: {
      olive: { DEFAULT: '#6b7f4a', light: '#8a9b6e', dark: '#4a6332' },
      mocha: { DEFAULT: '#a08b6e', light: '#f5f0e8', border: '#e6ddd0', dark: '#8a7358' },
      terra: { DEFAULT: '#c2715a', light: '#faf0ed', dark: '#a85a44' },
      cream: { DEFAULT: '#faf8f4', card: '#ffffff', surface: '#f9f8f3', icon: '#f0eee6', pill: '#f7f5ee', dark: '#f0eee6' },
      warm: { DEFAULT: '#d4d0c0', border: '#e8e5d8', divider: '#f0efe8', 'btn-border': '#d4d0c0', gray: '#8b8b7e' },
      'ingredient-pill-bg': '#f7f5ee',
      text: { primary: '#2c2c2a', secondary: '#8b8b7e', tertiary: '#a09f96', muted: '#c4c3ba' },
    },
    borderRadius: { card: '12px', 'card-lg': '14px', button: '12px', 'button-sm': '8px', input: '10px', pill: '6px', tag: '12px', 'image-hero': '16px', 'image-card': '10px' },
    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'] },
    lineHeight: { tight: '1.25', normal: '1.5', relaxed: '1.75' },
    fontSize: { tiny: '10px' },
  } }
};
</script>
<style>
  html { scroll-behavior: smooth; }
  .nos::-webkit-scrollbar { display: none; } .nos { scrollbar-width: none; }
  .row::-webkit-scrollbar { height: 8px; }
  .row::-webkit-scrollbar-thumb { background: #d4d0c0; border-radius: 8px; }
  @keyframes pulse-soft { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .sk { animation: pulse-soft 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .sk, .animate-spin { animation: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body class="bg-cream-icon font-sans text-text-primary antialiased">

<div class="max-w-[1320px] mx-auto px-4 pt-8 pb-4">
  <p class="text-[12px] uppercase tracking-[0.06em] text-text-tertiary">FreshUp · recipe acquisition · screen 1</p>
  <h1 class="text-[26px] font-medium leading-[1.3] mt-1">Add a recipe<span class="text-olive">.</span></h1>
  <p class="text-[14px] leading-normal text-text-secondary mt-2 max-w-[640px]">One link box for every site, a saved-page path beside it, a supported-sources popup, and a sources view with a feed per source. Scroll each row sideways.</p>
</div>
<div class="sticky top-0 z-20 bg-cream-icon border-b border-warm-border"><div class="max-w-[1320px] mx-auto px-4 flex gap-2 py-2 overflow-x-auto"><a href="#add" class="shrink-0 h-11 px-4 inline-flex items-center rounded-button-sm bg-cream-card border border-warm-border text-[14px] text-olive-dark font-medium">1 · Add screen</a><a href="#sources" class="shrink-0 h-11 px-4 inline-flex items-center rounded-button-sm bg-cream-card border border-warm-border text-[14px] text-olive-dark font-medium">2 · Sources view</a><a href="#results" class="shrink-0 h-11 px-4 inline-flex items-center rounded-button-sm bg-cream-card border border-warm-border text-[14px] text-olive-dark font-medium">3 · After the hand-over</a></div></div>
<main id="app" class="max-w-[1320px] mx-auto pb-16"></main>

<script>
/* ---------- shared bits (each maps to a React component) ---------- */
const dot = '<span class="text-olive">.</span>';
const P = {
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  upload:'<path d="M12 16V5"/><path d="M7 10l5-5 5 5"/><path d="M5 19h14"/>',
  clip:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5a3 3 0 0 1 6 0"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
  ext:'<path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>',
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  shelf:'<path d="M4 20V4M20 20V4M4 9h16M4 15h16"/>',
  cart:'<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  bookmark:'<path d="M7 4h10v16l-5-4-5 4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', down:'<path d="M5 9l7 7 7-7"/>', up:'<path d="M5 15l7-7 7 7"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', refresh:'<path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M19 5v4h-4"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/>',
  grip:'<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/>',
  camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', minus:'<path d="M5 12h14"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/>',
};
const ico = (n, c = 'w-5 h-5', fill = false) =>
  `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" ${fill === true ? 'fill-opacity=".18"' : ''} stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// stand-in for Recipe.source_image (remote images can't load in this preview)
const food = (cls, v = 0) => {
  const bits = [
    '<circle cx="50" cy="44" r="9" fill="#8a9b6e"/><circle cx="68" cy="42" r="8" fill="#a08b6e"/><circle cx="60" cy="58" r="9" fill="#c2715a" fill-opacity=".8"/><circle cx="44" cy="58" r="5" fill="#f5f0e8"/><circle cx="75" cy="56" r="5" fill="#6b7f4a"/>',
    '<rect x="42" y="38" width="14" height="12" rx="3" fill="#a08b6e"/><rect x="60" y="36" width="14" height="12" rx="3" fill="#8a7358"/><rect x="50" y="53" width="14" height="12" rx="3" fill="#a08b6e"/><circle cx="74" cy="58" r="6" fill="#8a9b6e"/><circle cx="42" cy="60" r="4" fill="#6b7f4a"/>',
  ][v];
  return `<div class="${cls} bg-mocha-light overflow-hidden"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" class="w-full h-full block" role="img" aria-label="Recipe photo"><rect width="120" height="90" fill="#f5f0e8"/><ellipse cx="60" cy="50" rx="38" ry="30" fill="#ffffff" stroke="#e6ddd0"/><ellipse cx="60" cy="50" rx="29" ry="22" fill="#f7f5ee"/>${bits}</svg></div>`;
};

const nav = () => {
  const tab = (n, label, on, badge) => `<a href="#" class="relative flex flex-col items-center justify-center gap-0.5 min-h-[44px] ${on ? 'text-olive font-medium' : 'text-text-secondary'}"><span class="relative">${ico(n, 'w-[22px] h-[22px]', on)}${badge ? `<span class="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-mocha text-cream-card text-tiny font-medium flex items-center justify-center">${badge}</span>` : ''}</span><span class="text-tiny">${label}</span></a>`;
  return `<nav class="mt-auto bg-cream-card border-t border-warm-border grid grid-cols-5 h-[60px]" aria-label="Main">${tab('home','Home')}${tab('cal','Plan')}${tab('doc','Recipes',true)}${tab('shelf','Pantry')}${tab('cart','List',false,8)}</nav>`;
};
const head = (sub = '', title = 'Add a recipe', back = 'Recipes') => `<header class="px-4 pt-3 pb-3"><a href="#" class="inline-flex items-center gap-1 h-11 -ml-1.5 pr-3 text-olive text-[14px]">${ico('back','w-5 h-5')}${back}</a><h1 class="text-[22px] font-medium leading-[1.3] text-text-primary">${title}${dot}</h1>${sub ? `<p class="text-[14px] leading-normal text-text-secondary mt-1">${sub}</p>` : ''}</header>`;

const phone = (n, label, note, body, minH = 'min-h-[780px]') => `<figure class="w-[375px] shrink-0 snap-start flex flex-col"><figcaption class="mb-3 h-[52px]"><p class="text-[13px] font-medium text-text-primary">${n} · ${label}</p><p class="text-[12px] leading-[1.4] text-text-secondary">${note}</p></figcaption><div class="relative w-[375px] flex-1 ${minH} bg-cream border border-warm rounded-[28px] overflow-hidden flex flex-col">${body}</div></figure>`;
const section = (id, name, pitch, frames) => `<section id="${id}" class="scroll-mt-20 pt-10"><div class="px-4"><h2 class="text-[22px] font-medium leading-[1.3]">${name}${dot}</h2><p class="text-[14px] leading-normal text-text-secondary mt-1 max-w-[680px]">${pitch}</p></div><div class="row flex gap-6 overflow-x-auto snap-x px-4 pt-6 pb-4">${frames.join('')}</div></section>`;

const btn = (t, extra = '') => `<button class="h-12 px-4 rounded-button bg-olive text-cream-card text-[15px] font-medium inline-flex items-center justify-center gap-2 ${extra}">${t}</button>`;
const btn2 = (t, extra = '') => `<button class="h-12 px-4 rounded-button bg-cream-card border border-warm-btn-border text-text-primary text-[15px] inline-flex items-center justify-center gap-2 ${extra}">${t}</button>`;
const btnOff = (t, extra = '') => `<button disabled class="h-12 px-4 rounded-button bg-warm-divider text-text-tertiary text-[15px] font-medium inline-flex items-center justify-center ${extra}">${t}</button>`;
const label = (t, extra = '') => `<p class="text-[12px] uppercase tracking-[0.06em] text-text-tertiary ${extra}">${t}</p>`;
const spin = (c = 'border-cream-card/40 border-t-cream-card') => `<span class="inline-block w-4 h-4 rounded-full border-2 ${c} animate-spin"></span>`;
const tags = (list) => `<div class="flex flex-wrap gap-1.5">${list.map(t => `<span class="text-[11px] text-text-secondary bg-cream-icon rounded-tag px-2.5 py-1">${t}</span>`).join('')}</div>`;
const badge = (t) => `<span class="bg-cream-card text-text-primary text-tiny font-medium px-2 py-1 rounded-pill">${t}</span>`;
const urlField = (url, filled = true) => `<div class="h-12 flex items-center gap-2 px-3 rounded-input border border-warm-border bg-cream-card"><span class="text-text-tertiary">${ico('link','w-[18px] h-[18px]')}</span><span class="flex-1 truncate text-[14px] ${filled ? 'text-text-primary' : 'text-text-tertiary'}">${url}</span></div>`;

/* ---------- content, shaped like the real data ---------- */
// Recipe { name, source_type, source_url, prep_time_minutes, cook_time_minutes, base_servings, tags[], ingredients[] }
const R = { name: 'Sweet chili tofu bowls', prep: 10, cook: 25, servings: 2, tags: ['vegan', 'asian-inspired', 'quick'],
  url: 'hellofresh.com/recipes/sweet-chili-tofu-bowls-5f3a…' };
// quantity 0.001 -> no amount given, show the name alone
const ING = [['14','oz','Firm tofu'],['¾','cup','Jasmine rice'],['3','tbsp','Sweet chili sauce'],['1','tbsp','Soy sauce'],['1','tbsp','Cornstarch'],['6','oz','Green beans'],['2','','Scallions'],['1','','Lime'],['','','Salt'],['','','Cooking oil'],['1','tsp','Sesame seeds',true]];
const WARN = 'No amount given for: Salt, Cooking oil';
const KS_LINE = 'Kitchen Sanctuary only opens its door to people, not apps, so open the recipe in your own browser, save or copy the page, and hand it over here.';

const ingRows = (list = ING) => list.map(([q, u, n, opt]) => `<li class="flex items-baseline gap-3 py-2.5 border-b border-warm-divider last:border-0"><span class="w-[68px] shrink-0 text-[13px] text-text-secondary">${q}${u ? ' ' + u : ''}</span><span class="flex-1 text-[14px] text-text-primary">${n}</span>${opt ? '<span class="text-tiny text-text-secondary bg-cream-pill rounded-pill px-1.5 py-0.5">optional</span>' : ''}</li>`).join('');
const meta = () => `<p class="flex items-center gap-1.5 text-[12px] leading-[1.4] text-text-secondary">${ico('clock','w-3.5 h-3.5')}Prep ${R.prep} min · Cook ${R.cook} min · Serves ${R.servings}</p>`;
const note = (t = WARN + '. They are listed by name only.') => `<div class="flex gap-2 p-3 rounded-card bg-mocha-light border border-mocha-border text-[12px] leading-[1.4] text-mocha-dark"><span class="text-mocha">${ico('info','w-4 h-4')}</span><p>${t}</p></div>`;
const origin = (host = 'hellofresh.com') => `<a href="#" class="inline-flex items-center gap-1 min-h-[44px] text-[12px] text-olive">From ${host} · view original ${ico('ext','w-3.5 h-3.5')}</a>`;
const existing = (ctx, v = 0) => `<a href="#" class="flex items-center gap-3 p-3 rounded-card bg-cream-card border border-warm-border">${food('w-16 h-16 rounded-image-card shrink-0', v)}<span class="flex-1 min-w-0"><span class="block text-[13px] font-medium text-text-primary">${R.name}</span><span class="block text-[12px] text-text-secondary mt-0.5">35 min · 2 srv · vegan</span><span class="block text-[11px] mt-1">${ctx}</span></span><span class="text-olive">${ico('chev','w-4 h-4')}</span></a>`;
const cooked = `<span class="text-olive-dark">✓ Cooked 3x</span><span class="text-text-secondary"> · saved by the household</span>`;
const sk = (w, h = 'h-3') => `<div class="sk ${h} ${w} rounded-pill bg-cream-icon"></div>`;

/* ---------- round-two pieces ---------- */
const dim = (sheet) => `<div class="absolute inset-0 bg-text-primary/30 flex items-end"><div class="w-full max-h-[94%] overflow-y-auto bg-cream rounded-t-card-lg" role="dialog" aria-modal="true"><div class="w-9 h-1 rounded-full bg-warm mx-auto mt-2"></div>${sheet}</div></div>`;
const num = (n, t, extra = '') => `<li class="flex gap-3"><span class="w-8 h-8 shrink-0 rounded-full bg-cream-icon text-olive-dark text-[15px] font-medium flex items-center justify-center">${n}</span><div class="flex-1 pt-1"><p class="text-[14px] leading-normal">${t}</p>${extra}</div></li>`;
const stat = (v, l) => `<div class="py-3 text-center bg-cream-surface border border-warm-border rounded-card"><p class="text-[15px] font-medium">${v}</p><p class="text-[11px] text-text-secondary">${l}</p></div>`;
const mark = (c, on = false) => `<span class="w-8 h-8 shrink-0 rounded-button-sm ${on ? 'bg-olive text-cream-card' : 'bg-cream-icon text-olive'} text-[13px] font-medium flex items-center justify-center">${c.length > 1 ? ico(c,'w-[18px] h-[18px]') : c}</span>`;
const pill = (t, kind = 'olive') => `<span class="shrink-0 text-tiny font-medium rounded-pill px-1.5 py-1 ${kind === 'olive' ? 'bg-cream-pill text-olive-dark' : 'bg-mocha-light text-mocha-dark'}">${t}</span>`;
const srcRow = (c, name, hint, p, kind) => `<a href="#" class="flex items-center gap-3 px-3 min-h-[60px] py-2 border-b border-warm-divider last:border-0">${mark(c)}<span class="flex-1 min-w-0"><span class="block text-[14px] font-medium">${name}</span><span class="block text-[12px] leading-[1.4] text-text-secondary">${hint}</span></span>${p ? pill(p, kind) : ''}<span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>`;
// RecipeCard, grid variant. Saved = filled olive bookmark, not saved = outline.
const card = (name, m, ctx, saved, v = 0, src = '', cls = '') => `<a href="#" class="block bg-cream-card border border-warm-border rounded-card overflow-hidden ${cls}"><div class="relative">${food('aspect-[4/3] w-full', v)}${src ? `<span class="absolute top-2 left-2">${badge(src)}</span>` : ''}${saved ? '<span class="absolute bottom-2 left-2 bg-olive text-cream-card text-tiny font-medium px-1.5 py-0.5 rounded-pill">Saved</span>' : ''}<button class="absolute top-0 right-0 w-11 h-11 flex items-center justify-center" aria-label="${saved ? 'Saved' : 'Save'}" aria-pressed="${saved}"><span class="w-7 h-7 rounded-full bg-cream-card flex items-center justify-center ${saved ? 'text-olive' : 'text-text-secondary'}">${ico('bookmark','w-4 h-4', saved ? 'solid' : false)}</span></button></div><div class="p-3"><p class="text-[13px] font-medium leading-[1.3]">${name}</p><p class="text-[11px] text-text-secondary mt-1">${m}</p><p class="text-tiny mt-1">${ctx}</p></div></a>`;
const never = '<span class="text-mocha">Never cooked</span>';
const ck = (n) => `<span class="text-olive-dark">✓ Cooked ${n}x</span>`;
const mini = (name, v) => `<a href="#" class="block w-[104px] shrink-0">${food('w-[104px] h-[78px] rounded-image-card', v)}<span class="block text-[11px] leading-[1.3] text-text-primary mt-1.5">${name}</span></a>`;
const linkCard = (url, filled, cta) => `<div class="mx-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <label class="block text-[14px] font-medium mb-2">Paste a link</label>
      <div class="flex gap-2"><div class="flex-1 min-w-0">${urlField(url, filled)}</div>${filled ? '' : btn2('Paste', 'px-3 text-[14px]')}</div>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-2">Works for HelloFresh and most recipe sites.</p>${cta}</div>`;
const whichLink = `<a href="#" class="mx-4 inline-flex items-center gap-1.5 min-h-[44px] text-[13px] text-olive">${ico('info','w-4 h-4')}Which sources work?</a>`;
const savedCard = `<div class="mx-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <p class="text-[14px] font-medium">Or hand over the saved page</p>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-1">For sites that turn links away, like Kitchen Sanctuary.</p>
      <div class="grid grid-cols-2 gap-2 mt-3">${btn2(ico('clip','w-[18px] h-[18px]') + 'Paste page', 'text-[14px]')}${btn2(ico('upload','w-[18px] h-[18px]') + 'Upload', 'text-[14px]')}</div>
      <a href="#" class="inline-flex items-center min-h-[44px] -mb-3 text-[13px] text-olive">Show me how →</a></div>`;
const browseRow = `<a href="#" class="mx-4 mt-4 flex items-center gap-3 px-3 min-h-[60px] bg-cream-card border border-warm-border rounded-card">${mark('doc')}<span class="flex-1"><span class="block text-[14px] font-medium">Browse by source</span><span class="block text-[12px] text-text-secondary">24 new from HelloFresh this week</span></span><span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>`;
const addBase = `${head()}${linkCard('Paste a recipe link…', false, btnOff('Fetch recipe', 'w-full mt-4'))}${whichLink}${savedCard}${browseRow}${nav()}`;
const sent = (url) => `<div class="mx-4 px-3 py-3 bg-cream-card border border-warm-border rounded-card flex items-center gap-2 text-[13px]"><span class="text-text-tertiary">${ico('link','w-4 h-4')}</span><span class="flex-1 truncate text-text-secondary">${url}</span><a href="#" class="text-olive">Edit</a></div>`;


/* ---------- shared by browse, sources and detail ---------- */
const RX = {
  tofu: ['Sweet chili tofu bowls', '35 min · 2 srv · vegan', 0, 'HelloFresh'],
  noodle: ['Peanut noodle stir-fry', '25 min · 2 srv · vegan', 1, 'HelloFresh'],
  chick: ['Crispy sesame chicken', '30 min · 4 srv · chinese', 1, 'Kitchen Sanctuary'],
  tacos: ['One-pan black bean tacos', '25 min · 2 srv · vegan', 0, 'HelloFresh'],
  gnocchi: ['Creamy tomato gnocchi', '20 min · 2 srv · vegetarian', 1, 'HelloFresh'],
  ginger: ['Sesame ginger chicken', '30 min · 2 srv · asian', 1, 'HelloFresh'],
  stew: ['Smoky chickpea stew', '35 min · 2 srv · vegan', 0, 'HelloFresh'],
  curry: ['Slow cooker beef curry', '6 hr 15 min · 6 srv · curry', 0, 'Kitchen Sanctuary'],
  dal: ['Coconut red lentil dal', '30 min · 4 srv · vegan', 1, ''],
};
const fresh = '<span class="text-text-secondary">Not saved yet</span>';
const rc = (k, ctx, saved, cls = '', showSrc = true) => card(RX[k][0], RX[k][1], ctx, saved, RX[k][2], showSrc ? RX[k][3] : '', cls);
const strip = (cards) => `<div class="nos flex gap-2.5 overflow-x-auto px-4 mt-3">${cards.join('')}</div>`;
const cc = 'w-[150px] min-w-[150px] shrink-0';           // carousel card
const ccLast = cc + ' opacity-70';                        // last card hints at scroll
const seeAll = (t = 'See all') => `<a href="#" class="shrink-0 min-h-[44px] inline-flex items-center text-[12px] text-olive">${t} →</a>`;
const sec = (t, sub = '', right = '', mt = 'mt-5') => `<div class="mx-4 ${mt} flex items-center justify-between gap-3"><div class="min-w-0"><h2 class="text-[15px] font-medium leading-[1.3]">${t}${dot}</h2>${sub ? `<p class="text-[12px] leading-[1.4] text-text-secondary">${sub}</p>` : ''}</div>${right}</div>`;

/* =====================================================================
   ROW 1 · The add screen: one link box for every site, saved page beside it
   ===================================================================== */
const ADD = [
  phone(1, 'Empty', 'One link box, no source to pick. The saved-page path and the source feeds are one tap away.', addBase),

  phone(2, 'Supported sources popup', 'Opens from "Which sources work?". Three plain rows, each tappable through to that source.', `${addBase}${dim(`
    <div class="px-4 pt-3 pb-4">
      <h2 class="text-[15px] font-medium">Supported sources${dot}</h2>
      <p class="text-[13px] leading-normal text-text-secondary mt-1">A link is always worth a try. The saved page works when a site turns the link away.</p>
      <div class="mt-3 bg-cream-card border border-warm-border rounded-card">
        ${srcRow('H', 'HelloFresh', 'Paste the link, done.', 'Link works')}
        ${srcRow('K', 'Kitchen Sanctuary', 'Open it in your browser, then hand over the page.', 'Saved page', 'mocha')}
        ${srcRow('globe', 'Any other recipe site', 'Try the link first, saved page as the backup.', '')}
      </div>
      ${btn('Got it', 'w-full mt-4')}
    </div>`)}`),

  phone(3, 'Kitchen Sanctuary link pasted', 'Caught before fetching, so nobody has to fail first to learn the quirk.', `${head()}${linkCard('kitchensanctuary.com/crispy-sesame-chicken/', true, `
      <div class="mt-3 p-3 rounded-card bg-mocha-light border border-mocha-border">
        <p class="text-[14px] font-medium">This one needs the saved page${dot}</p>
        <p class="text-[13px] leading-normal text-mocha-dark mt-1">${KS_LINE}</p>
        ${btn('Show me how', 'w-full mt-3')}
        <button class="w-full h-11 text-[14px] text-text-secondary">Try the link anyway</button>
      </div>`)}${whichLink}${savedCard}${nav()}`),

  phone(4, 'Saved page handed over', 'The file is named and recognized before it is read.', `${head()}
    <div class="mx-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <p class="text-[14px] font-medium mb-3">Saved page</p>
      <div class="flex items-center gap-3 p-3 rounded-card bg-cream-surface border border-warm-border"><span class="w-10 h-10 rounded-button-sm bg-cream-icon text-olive flex items-center justify-center">${ico('file')}</span><span class="flex-1 min-w-0"><span class="block text-[14px] truncate">Crispy sesame chicken.html</span><span class="block text-[12px] text-text-secondary">412 KB</span></span><button class="w-11 h-11 -mr-2 flex items-center justify-center text-text-secondary" aria-label="Remove file">${ico('x','w-4 h-4')}</button></div>
      <p class="text-[13px] leading-normal text-text-secondary mt-3"><span class="text-olive-dark">✓</span> Looks like a saved page from Kitchen Sanctuary.</p>
      ${btn('Read recipe', 'w-full mt-4')}
      <button class="w-full h-11 text-[14px] text-text-secondary">Use a link instead</button>
    </div>${nav()}`),
];

/* =====================================================================
   ROW 2 · Sources view: pick a source, browse its feed, add a specific recipe on demand
   ===================================================================== */
const visit = (host) => `<a href="https://www.${host}" class="mx-4 -mt-2 inline-flex items-center gap-1 min-h-[44px] text-[13px] text-olive">${host} ${ico('ext','w-3.5 h-3.5')}</a>`;
const expander = (open, inner = '') => `<div class="mx-4 bg-cream-card border border-warm-border rounded-card-lg"><button aria-expanded="${open}" class="w-full flex items-center gap-3 px-3 min-h-[52px] text-left">${mark('plus')}<span class="flex-1 text-[14px] font-medium">Add a specific recipe</span><span class="text-text-tertiary">${ico(open ? 'up' : 'down','w-4 h-4')}</span></button>${open ? `<div class="px-4 pb-4 pt-4 border-t border-warm-divider">${inner}</div>` : ''}</div>`;
const pinned = `<span class="shrink-0 inline-flex items-center gap-1 text-[11px] text-text-tertiary">${ico('pin','w-3.5 h-3.5')}Pinned</span>`;
const hfPinned = `${sec('Cooked most often', 'From HelloFresh, by this household', pinned)}${strip([rc('tofu', ck(12), true, cc, false), rc('noodle', ck(7), true, cc, false), rc('gnocchi', ck(3), true, ccLast, false)])}`;

const SRC = [
  phone(5, 'Sources', 'Reached from "Browse by source". Each source shows how it imports and a taste of what it has.', `${head('', 'Sources', 'Add a recipe')}
    <div class="mx-4 bg-cream-card border border-warm-border rounded-card-lg overflow-hidden">
      <a href="#" class="flex items-center gap-3 px-3 min-h-[56px]">${mark('H')}<span class="flex-1 text-[15px] font-medium">HelloFresh</span>${pill('Link works')}<span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>
      <div class="flex gap-2.5 px-3 pb-3 overflow-hidden">${mini('One-pan black bean tacos', 0)}${mini('Creamy tomato gnocchi', 1)}${mini('Sesame ginger chicken', 0)}</div>
      <p class="px-3 py-2.5 border-t border-warm-divider text-[12px] text-text-secondary">24 new this week · 61 in the library</p>
    </div>
    <div class="mx-4 mt-3 bg-cream-card border border-warm-border rounded-card-lg overflow-hidden">
      <a href="#" class="flex items-center gap-3 px-3 min-h-[56px]">${mark('K')}<span class="flex-1 text-[15px] font-medium">Kitchen Sanctuary</span>${pill('Saved page', 'mocha')}<span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>
      <div class="flex gap-2.5 px-3 pb-3 overflow-hidden">${mini('Crispy sesame chicken', 1)}${mini('Slow cooker beef curry', 0)}</div>
      <p class="px-3 py-2.5 border-t border-warm-divider text-[12px] text-text-secondary">2 in the library · added one at a time</p>
    </div>
    <a href="#" class="mx-4 mt-3 flex items-center gap-3 px-3 min-h-[60px] bg-cream-card border border-warm-border rounded-card-lg">${mark('globe')}<span class="flex-1"><span class="block text-[15px] font-medium">Any other recipe site</span><span class="block text-[12px] text-text-secondary">Try a link first, saved page as the backup</span></span><span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>
    ${nav()}`),

  phone(6, 'HelloFresh, add collapsed', 'The default. The feed leads, "Add a specific recipe" is one quiet row, and the site itself is linked under the title.', `${head('', 'HelloFresh', 'Sources')}${visit('hellofresh.com')}
    ${expander(false)}
    ${hfPinned}
    ${sec('New this week', '', seeAll('See all 24'))}
    <div class="mx-4 mb-4 grid grid-cols-2 gap-3">
      ${rc('tacos', fresh, false, '', false)}${rc('ginger', fresh, false, '', false)}${rc('stew', fresh, false, '', false)}${rc('dal', fresh, false, '', false)}
    </div>${nav()}`),

  phone(7, 'HelloFresh, add expanded', 'Tapping the row opens the link box in place, with a shortcut out to the site to go find one.', `${head('', 'HelloFresh', 'Sources')}${visit('hellofresh.com')}
    ${expander(true, `
      <div class="flex gap-2"><div class="flex-1 min-w-0">${urlField('Paste a HelloFresh link…', false)}</div>${btn2('Paste', 'px-3 text-[14px]')}</div>
      ${btnOff('Fetch recipe', 'w-full mt-3')}
      <a href="https://www.hellofresh.com/recipes" class="inline-flex items-center gap-1 min-h-[44px] -mb-3 text-[13px] text-olive">Find one on hellofresh.com ${ico('ext','w-3.5 h-3.5')}</a>`)}
    ${hfPinned}
    ${sec('New this week', '', seeAll('See all 24'))}
    <div class="mx-4 mb-4 grid grid-cols-2 gap-3">${rc('tacos', fresh, false, '', false)}${rc('ginger', fresh, false, '', false)}</div>${nav()}`),

  phone(8, 'Kitchen Sanctuary, add expanded', 'Same row, different contents: the walkthrough, with step one linking straight to the site. Collapsed by default here too.', `${head('', 'Kitchen Sanctuary', 'Sources')}${visit('kitchensanctuary.com')}
    ${expander(true, `
      <p class="text-[14px] leading-normal">${KS_LINE}</p>
      <ol class="mt-4 space-y-4">
        ${num(1, `Open the recipe on <a href="https://www.kitchensanctuary.com" class="text-olive inline-flex items-center gap-1">kitchensanctuary.com ${ico('ext','w-3.5 h-3.5')}</a>`)}
        ${num(2, 'Save the page, or select everything and copy it.')}
        ${num(3, 'Hand it over.', `<div class="grid grid-cols-2 gap-2 mt-3">${btn(ico('clip','w-[18px] h-[18px]') + 'Paste', 'text-[14px]')}${btn2(ico('upload','w-[18px] h-[18px]') + 'Upload', 'text-[14px]')}</div>`)}
      </ol>`)}
    ${sec('Cooked most often', 'From Kitchen Sanctuary, by this household', pinned)}
    <div class="mx-4 mt-3 grid grid-cols-2 gap-3">${rc('chick', ck(4), true, '', false)}</div>
    ${sec('Also in the library')}
    <div class="mx-4 mt-3 mb-4 grid grid-cols-2 gap-3">${rc('curry', never, true, '', false)}</div>${nav()}`),
];

/* =====================================================================
   ROW 3 · After the hand-over: same for a link or a saved page
   ===================================================================== */
const RES = [
  phone(8, 'Fetching', 'The recipe card fills in as each part arrives: name first, then the rest.', `${head()}${sent(R.url)}
    <div class="mx-4 mt-4 bg-cream-card border border-warm-border rounded-card-lg overflow-hidden" role="status">
      <div class="sk aspect-[4/3] bg-cream-icon"></div>
      <div class="p-4">
        <h2 class="text-[22px] font-medium leading-[1.3]">${R.name}</h2>
        <div class="grid grid-cols-3 gap-2 mt-4">${[0,1,2].map(() => '<div class="sk h-[58px] rounded-card bg-cream-icon"></div>').join('')}</div>
        <div class="flex items-center gap-2 mt-5 text-[13px] text-text-secondary">${spin('border-warm border-t-olive')}Reading the ingredients…</div>
        <div class="mt-4 space-y-4">${sk('w-full')}${sk('w-5/6')}${sk('w-2/3')}${sk('w-3/4')}</div>
      </div>
    </div>
    <button class="mx-4 h-11 mt-1 text-[14px] text-text-secondary">Cancel</button>${nav()}`),

  phone(9, 'Preview before saving', 'Stat tiles for the times, a dashed rule before the ingredients, a gentle note for missing amounts.', `${head()}
    <div class="mx-4 bg-cream-card border border-warm-border rounded-card-lg overflow-hidden">
      <div class="relative">${food('aspect-[4/3] w-full', 1)}<span class="absolute top-2 left-2">${badge('HelloFresh')}</span></div>
      <div class="p-4">
        <h2 class="text-[22px] font-medium leading-[1.3]">${R.name}</h2>
        <div class="mt-3">${tags(R.tags)}</div>
        <div class="grid grid-cols-3 gap-2 mt-4">${stat(R.prep + ' min','Prep')}${stat(R.cook + ' min','Cook')}${stat(R.servings,'Servings')}</div>
        <div class="border-t border-dashed border-warm mt-5 pt-4">
          <div class="flex items-baseline justify-between"><h3 class="text-[15px] font-medium">Ingredients${dot}</h3><span class="text-[12px] text-text-secondary">${ING.length} found</span></div>
          <ul class="mt-1">${ingRows()}</ul>
        </div>
        <div class="mt-3">${note()}</div>
        <div class="mt-1">${origin()}</div>
      </div>
    </div>
    <div class="h-4"></div>
    <div class="mt-auto px-4 py-3 bg-cream border-t border-warm-border flex gap-2">${btn2('Not this one')}${btn('Save to library', 'flex-1')}</div>
    ${nav().replace('mt-auto ', '')}`),

  phone(10, 'Already in the library', 'Shown as the real recipe card, so it reads as "found it" rather than "rejected".', `${head()}${sent(R.url)}
    <div class="mx-4 mt-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <h2 class="text-[15px] font-medium">Already in the library${dot}</h2>
      <p class="text-[13px] leading-normal text-text-secondary mt-1">Nothing new was added. Here it is.</p>
      <div class="w-[190px] mx-auto mt-4">${card(R.name, '35 min · 2 srv · vegan', ck(3), true, 1, 'HelloFresh')}</div>
      ${btn('Open recipe', 'w-full mt-4')}
      ${btn2('Add a different recipe', 'w-full mt-2')}
    </div>${nav()}`),

  phone(11, 'Could not import', 'The specific reason, a retry, and the saved page offered as the sure thing.', `${head()}${sent(R.url)}
    <div class="mx-4 mt-4 p-4 bg-mocha-light border border-mocha-border rounded-card-lg">
      <div class="flex gap-2"><span class="text-mocha mt-0.5">${ico('info','w-5 h-5')}</span><div>
        <h2 class="text-[15px] font-medium">HelloFresh didn't answer${dot}</h2>
        <p class="text-[13px] leading-normal text-mocha-dark mt-1">The page took longer than 30 seconds to load, so the fetch was stopped. Nothing was added.</p></div></div>
      ${btn('Try again', 'w-full mt-3')}
    </div>
    <div class="mx-4 mt-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <h2 class="text-[15px] font-medium">Or skip the wait${dot}</h2>
      <p class="text-[13px] leading-normal text-text-secondary mt-1">Open the recipe in your browser, save or copy the page, and hand it over here.</p>
      <div class="grid grid-cols-2 gap-2 mt-3">${btn2(ico('clip','w-[18px] h-[18px]') + 'Paste page', 'text-[14px]')}${btn2(ico('upload','w-[18px] h-[18px]') + 'Upload', 'text-[14px]')}</div>
    </div>${nav()}`),
];

document.getElementById('app').innerHTML =
  section('add', '1 · The add screen', 'One link box for every site, HelloFresh included. The saved page sits right under it, and a popup spells out which sources need which.', ADD) +
  section('sources', '2 · Sources view', 'Choose a source and its feed leads. "Add a specific recipe" expands in place, the site itself is linked under the title, and "Cooked most often" is pinned wherever something has been cooked.', SRC) +
  section('results', '3 · After the hand-over', 'Identical whether a link or a saved page came in.', RES);
</script>
</body>
</html>
