<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshUp 3: recipe detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// theme.extend copied from the attached tailwind.config.js, token names unchanged
tailwind.config = {
  theme: { extend: {
    colors: {
      olive: { DEFAULT: '#6b7f4a', light: '#8a9b6e', dark: '#4a6332' },
      mocha: { DEFAULT: '#a08b6e', light: '#f5f0e8', border: '#e6ddd0', dark: '#8a7358' },
      terra: { DEFAULT: '#c2715a', light: '#faf0ed', dark: '#a85a44' },
      cream: { DEFAULT: '#faf8f4', card: '#ffffff', surface: '#f9f8f3', icon: '#f0eee6', pill: '#f7f5ee', dark: '#f0eee6' },
      warm: { DEFAULT: '#d4d0c0', border: '#e8e5d8', divider: '#f0efe8', 'btn-border': '#d4d0c0', gray: '#8b8b7e' },
      'ingredient-pill-bg': '#f7f5ee',
      text: { primary: '#2c2c2a', secondary: '#8b8b7e', tertiary: '#a09f96', muted: '#c4c3ba' },
    },
    borderRadius: { card: '12px', 'card-lg': '14px', button: '12px', 'button-sm': '8px', input: '10px', pill: '6px', tag: '12px', 'image-hero': '16px', 'image-card': '10px' },
    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'] },
    lineHeight: { tight: '1.25', normal: '1.5', relaxed: '1.75' },
    fontSize: { tiny: '10px' },
  } }
};
</script>
<style>
  html { scroll-behavior: smooth; }
  .nos::-webkit-scrollbar { display: none; } .nos { scrollbar-width: none; }
  .row::-webkit-scrollbar { height: 8px; }
  .row::-webkit-scrollbar-thumb { background: #d4d0c0; border-radius: 8px; }
  @keyframes pulse-soft { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .sk { animation: pulse-soft 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .sk, .animate-spin { animation: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body class="bg-cream-icon font-sans text-text-primary antialiased">

<div class="max-w-[1320px] mx-auto px-4 pt-8 pb-4">
  <p class="text-[12px] uppercase tracking-[0.06em] text-text-tertiary">FreshUp · recipe acquisition · screen 3</p>
  <h1 class="text-[26px] font-medium leading-[1.3] mt-1">Recipe detail<span class="text-olive">.</span></h1>
  <p class="text-[14px] leading-normal text-text-secondary mt-2 max-w-[640px]">Ingredients first, then Cook & enjoy!, then Nutrition. Save, like, "I cooked this" and "Add to plan", with rating unlocked by cooking. Scroll sideways.</p>
</div>

<main id="app" class="max-w-[1320px] mx-auto pb-16"></main>

<script>
/* ---------- shared bits (each maps to a React component) ---------- */
const dot = '<span class="text-olive">.</span>';
const P = {
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  upload:'<path d="M12 16V5"/><path d="M7 10l5-5 5 5"/><path d="M5 19h14"/>',
  clip:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5a3 3 0 0 1 6 0"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
  ext:'<path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>',
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  shelf:'<path d="M4 20V4M20 20V4M4 9h16M4 15h16"/>',
  cart:'<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  bookmark:'<path d="M7 4h10v16l-5-4-5 4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', down:'<path d="M5 9l7 7 7-7"/>', up:'<path d="M5 15l7-7 7 7"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', refresh:'<path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M19 5v4h-4"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/>',
  grip:'<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/>',
  camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', minus:'<path d="M5 12h14"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/>',
};
const ico = (n, c = 'w-5 h-5', fill = false) =>
  `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" ${fill === true ? 'fill-opacity=".18"' : ''} stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// stand-in for Recipe.source_image (remote images can't load in this preview)
const food = (cls, v = 0) => {
  const bits = [
    '<circle cx="50" cy="44" r="9" fill="#8a9b6e"/><circle cx="68" cy="42" r="8" fill="#a08b6e"/><circle cx="60" cy="58" r="9" fill="#c2715a" fill-opacity=".8"/><circle cx="44" cy="58" r="5" fill="#f5f0e8"/><circle cx="75" cy="56" r="5" fill="#6b7f4a"/>',
    '<rect x="42" y="38" width="14" height="12" rx="3" fill="#a08b6e"/><rect x="60" y="36" width="14" height="12" rx="3" fill="#8a7358"/><rect x="50" y="53" width="14" height="12" rx="3" fill="#a08b6e"/><circle cx="74" cy="58" r="6" fill="#8a9b6e"/><circle cx="42" cy="60" r="4" fill="#6b7f4a"/>',
  ][v];
  return `<div class="${cls} bg-mocha-light overflow-hidden"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" class="w-full h-full block" role="img" aria-label="Recipe photo"><rect width="120" height="90" fill="#f5f0e8"/><ellipse cx="60" cy="50" rx="38" ry="30" fill="#ffffff" stroke="#e6ddd0"/><ellipse cx="60" cy="50" rx="29" ry="22" fill="#f7f5ee"/>${bits}</svg></div>`;
};

const nav = () => {
  const tab = (n, label, on, badge) => `<a href="#" class="relative flex flex-col items-center justify-center gap-0.5 min-h-[44px] ${on ? 'text-olive font-medium' : 'text-text-secondary'}"><span class="relative">${ico(n, 'w-[22px] h-[22px]', on)}${badge ? `<span class="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-mocha text-cream-card text-tiny font-medium flex items-center justify-center">${badge}</span>` : ''}</span><span class="text-tiny">${label}</span></a>`;
  return `<nav class="mt-auto bg-cream-card border-t border-warm-border grid grid-cols-5 h-[60px]" aria-label="Main">${tab('home','Home')}${tab('cal','Plan')}${tab('doc','Recipes',true)}${tab('shelf','Pantry')}${tab('cart','List',false,8)}</nav>`;
};
const head = (sub = '', title = 'Add a recipe', back = 'Recipes') => `<header class="px-4 pt-3 pb-3"><a href="#" class="inline-flex items-center gap-1 h-11 -ml-1.5 pr-3 text-olive text-[14px]">${ico('back','w-5 h-5')}${back}</a><h1 class="text-[22px] font-medium leading-[1.3] text-text-primary">${title}${dot}</h1>${sub ? `<p class="text-[14px] leading-normal text-text-secondary mt-1">${sub}</p>` : ''}</header>`;

const phone = (n, label, note, body, minH = 'min-h-[780px]') => `<figure class="w-[375px] shrink-0 snap-start flex flex-col"><figcaption class="mb-3 h-[52px]"><p class="text-[13px] font-medium text-text-primary">${n} · ${label}</p><p class="text-[12px] leading-[1.4] text-text-secondary">${note}</p></figcaption><div class="relative w-[375px] flex-1 ${minH} bg-cream border border-warm rounded-[28px] overflow-hidden flex flex-col">${body}</div></figure>`;
const section = (id, name, pitch, frames) => `<section id="${id}" class="scroll-mt-20 pt-10"><div class="px-4"><h2 class="text-[22px] font-medium leading-[1.3]">${name}${dot}</h2><p class="text-[14px] leading-normal text-text-secondary mt-1 max-w-[680px]">${pitch}</p></div><div class="row flex gap-6 overflow-x-auto snap-x px-4 pt-6 pb-4">${frames.join('')}</div></section>`;

const btn = (t, extra = '') => `<button class="h-12 px-4 rounded-button bg-olive text-cream-card text-[15px] font-medium inline-flex items-center justify-center gap-2 ${extra}">${t}</button>`;
const btn2 = (t, extra = '') => `<button class="h-12 px-4 rounded-button bg-cream-card border border-warm-btn-border text-text-primary text-[15px] inline-flex items-center justify-center gap-2 ${extra}">${t}</button>`;
const btnOff = (t, extra = '') => `<button disabled class="h-12 px-4 rounded-button bg-warm-divider text-text-tertiary text-[15px] font-medium inline-flex items-center justify-center ${extra}">${t}</button>`;
const label = (t, extra = '') => `<p class="text-[12px] uppercase tracking-[0.06em] text-text-tertiary ${extra}">${t}</p>`;
const spin = (c = 'border-cream-card/40 border-t-cream-card') => `<span class="inline-block w-4 h-4 rounded-full border-2 ${c} animate-spin"></span>`;
const tags = (list) => `<div class="flex flex-wrap gap-1.5">${list.map(t => `<span class="text-[11px] text-text-secondary bg-cream-icon rounded-tag px-2.5 py-1">${t}</span>`).join('')}</div>`;
const badge = (t) => `<span class="bg-cream-card text-text-primary text-tiny font-medium px-2 py-1 rounded-pill">${t}</span>`;
const urlField = (url, filled = true) => `<div class="h-12 flex items-center gap-2 px-3 rounded-input border border-warm-border bg-cream-card"><span class="text-text-tertiary">${ico('link','w-[18px] h-[18px]')}</span><span class="flex-1 truncate text-[14px] ${filled ? 'text-text-primary' : 'text-text-tertiary'}">${url}</span></div>`;

/* ---------- content, shaped like the real data ---------- */
// Recipe { name, source_type, source_url, prep_time_minutes, cook_time_minutes, base_servings, tags[], ingredients[] }
const R = { name: 'Sweet chili tofu bowls', prep: 10, cook: 25, servings: 2, tags: ['vegan', 'asian-inspired', 'quick'],
  url: 'hellofresh.com/recipes/sweet-chili-tofu-bowls-5f3a…' };
// quantity 0.001 -> no amount given, show the name alone
const ING = [['14','oz','Firm tofu'],['¾','cup','Jasmine rice'],['3','tbsp','Sweet chili sauce'],['1','tbsp','Soy sauce'],['1','tbsp','Cornstarch'],['6','oz','Green beans'],['2','','Scallions'],['1','','Lime'],['','','Salt'],['','','Cooking oil'],['1','tsp','Sesame seeds',true]];
const WARN = 'No amount given for: Salt, Cooking oil';
const KS_LINE = 'Kitchen Sanctuary only opens its door to people, not apps, so open the recipe in your own browser, save or copy the page, and hand it over here.';

const ingRows = (list = ING) => list.map(([q, u, n, opt]) => `<li class="flex items-baseline gap-3 py-2.5 border-b border-warm-divider last:border-0"><span class="w-[68px] shrink-0 text-[13px] text-text-secondary">${q}${u ? ' ' + u : ''}</span><span class="flex-1 text-[14px] text-text-primary">${n}</span>${opt ? '<span class="text-tiny text-text-secondary bg-cream-pill rounded-pill px-1.5 py-0.5">optional</span>' : ''}</li>`).join('');
const meta = () => `<p class="flex items-center gap-1.5 text-[12px] leading-[1.4] text-text-secondary">${ico('clock','w-3.5 h-3.5')}Prep ${R.prep} min · Cook ${R.cook} min · Serves ${R.servings}</p>`;
const note = (t = WARN + '. They are listed by name only.') => `<div class="flex gap-2 p-3 rounded-card bg-mocha-light border border-mocha-border text-[12px] leading-[1.4] text-mocha-dark"><span class="text-mocha">${ico('info','w-4 h-4')}</span><p>${t}</p></div>`;
const origin = (host = 'hellofresh.com') => `<a href="#" class="inline-flex items-center gap-1 min-h-[44px] text-[12px] text-olive">From ${host} · view original ${ico('ext','w-3.5 h-3.5')}</a>`;
const existing = (ctx, v = 0) => `<a href="#" class="flex items-center gap-3 p-3 rounded-card bg-cream-card border border-warm-border">${food('w-16 h-16 rounded-image-card shrink-0', v)}<span class="flex-1 min-w-0"><span class="block text-[13px] font-medium text-text-primary">${R.name}</span><span class="block text-[12px] text-text-secondary mt-0.5">35 min · 2 srv · vegan</span><span class="block text-[11px] mt-1">${ctx}</span></span><span class="text-olive">${ico('chev','w-4 h-4')}</span></a>`;
const cooked = `<span class="text-olive-dark">✓ Cooked 3x</span><span class="text-text-secondary"> · saved by the household</span>`;
const sk = (w, h = 'h-3') => `<div class="sk ${h} ${w} rounded-pill bg-cream-icon"></div>`;

/* ---------- round-two pieces ---------- */
const dim = (sheet) => `<div class="absolute inset-0 bg-text-primary/30 flex items-end"><div class="w-full max-h-[94%] overflow-y-auto bg-cream rounded-t-card-lg" role="dialog" aria-modal="true"><div class="w-9 h-1 rounded-full bg-warm mx-auto mt-2"></div>${sheet}</div></div>`;
const num = (n, t, extra = '') => `<li class="flex gap-3"><span class="w-8 h-8 shrink-0 rounded-full bg-cream-icon text-olive-dark text-[15px] font-medium flex items-center justify-center">${n}</span><div class="flex-1 pt-1"><p class="text-[14px] leading-normal">${t}</p>${extra}</div></li>`;
const stat = (v, l) => `<div class="py-3 text-center bg-cream-surface border border-warm-border rounded-card"><p class="text-[15px] font-medium">${v}</p><p class="text-[11px] text-text-secondary">${l}</p></div>`;
const mark = (c, on = false) => `<span class="w-8 h-8 shrink-0 rounded-button-sm ${on ? 'bg-olive text-cream-card' : 'bg-cream-icon text-olive'} text-[13px] font-medium flex items-center justify-center">${c.length > 1 ? ico(c,'w-[18px] h-[18px]') : c}</span>`;
const pill = (t, kind = 'olive') => `<span class="shrink-0 text-tiny font-medium rounded-pill px-1.5 py-1 ${kind === 'olive' ? 'bg-cream-pill text-olive-dark' : 'bg-mocha-light text-mocha-dark'}">${t}</span>`;
const srcRow = (c, name, hint, p, kind) => `<a href="#" class="flex items-center gap-3 px-3 min-h-[60px] py-2 border-b border-warm-divider last:border-0">${mark(c)}<span class="flex-1 min-w-0"><span class="block text-[14px] font-medium">${name}</span><span class="block text-[12px] leading-[1.4] text-text-secondary">${hint}</span></span>${p ? pill(p, kind) : ''}<span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>`;
// RecipeCard, grid variant. Saved = filled olive bookmark, not saved = outline.
const card = (name, m, ctx, saved, v = 0, src = '', cls = '') => `<a href="#" class="block bg-cream-card border border-warm-border rounded-card overflow-hidden ${cls}"><div class="relative">${food('aspect-[4/3] w-full', v)}${src ? `<span class="absolute top-2 left-2">${badge(src)}</span>` : ''}${saved ? '<span class="absolute bottom-2 left-2 bg-olive text-cream-card text-tiny font-medium px-1.5 py-0.5 rounded-pill">Saved</span>' : ''}<button class="absolute top-0 right-0 w-11 h-11 flex items-center justify-center" aria-label="${saved ? 'Saved' : 'Save'}" aria-pressed="${saved}"><span class="w-7 h-7 rounded-full bg-cream-card flex items-center justify-center ${saved ? 'text-olive' : 'text-text-secondary'}">${ico('bookmark','w-4 h-4', saved ? 'solid' : false)}</span></button></div><div class="p-3"><p class="text-[13px] font-medium leading-[1.3]">${name}</p><p class="text-[11px] text-text-secondary mt-1">${m}</p><p class="text-tiny mt-1">${ctx}</p></div></a>`;
const never = '<span class="text-mocha">Never cooked</span>';
const ck = (n) => `<span class="text-olive-dark">✓ Cooked ${n}x</span>`;
const mini = (name, v) => `<a href="#" class="block w-[104px] shrink-0">${food('w-[104px] h-[78px] rounded-image-card', v)}<span class="block text-[11px] leading-[1.3] text-text-primary mt-1.5">${name}</span></a>`;
const linkCard = (url, filled, cta) => `<div class="mx-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <label class="block text-[14px] font-medium mb-2">Paste a link</label>
      <div class="flex gap-2"><div class="flex-1 min-w-0">${urlField(url, filled)}</div>${filled ? '' : btn2('Paste', 'px-3 text-[14px]')}</div>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-2">Works for HelloFresh and most recipe sites.</p>${cta}</div>`;
const whichLink = `<a href="#" class="mx-4 inline-flex items-center gap-1.5 min-h-[44px] text-[13px] text-olive">${ico('info','w-4 h-4')}Which sources work?</a>`;
const savedCard = `<div class="mx-4 p-4 bg-cream-card border border-warm-border rounded-card-lg">
      <p class="text-[14px] font-medium">Or hand over the saved page</p>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-1">For sites that turn links away, like Kitchen Sanctuary.</p>
      <div class="grid grid-cols-2 gap-2 mt-3">${btn2(ico('clip','w-[18px] h-[18px]') + 'Paste page', 'text-[14px]')}${btn2(ico('upload','w-[18px] h-[18px]') + 'Upload', 'text-[14px]')}</div>
      <a href="#" class="inline-flex items-center min-h-[44px] -mb-3 text-[13px] text-olive">Show me how →</a></div>`;
const browseRow = `<a href="#" class="mx-4 mt-4 flex items-center gap-3 px-3 min-h-[60px] bg-cream-card border border-warm-border rounded-card">${mark('doc')}<span class="flex-1"><span class="block text-[14px] font-medium">Browse by source</span><span class="block text-[12px] text-text-secondary">24 new from HelloFresh this week</span></span><span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></a>`;
const addBase = `${head()}${linkCard('Paste a recipe link…', false, btnOff('Fetch recipe', 'w-full mt-4'))}${whichLink}${savedCard}${browseRow}${nav()}`;
const sent = (url) => `<div class="mx-4 px-3 py-3 bg-cream-card border border-warm-border rounded-card flex items-center gap-2 text-[13px]"><span class="text-text-tertiary">${ico('link','w-4 h-4')}</span><span class="flex-1 truncate text-text-secondary">${url}</span><a href="#" class="text-olive">Edit</a></div>`;


/* ---------- shared by browse, sources and detail ---------- */
const RX = {
  tofu: ['Sweet chili tofu bowls', '35 min · 2 srv · vegan', 0, 'HelloFresh'],
  noodle: ['Peanut noodle stir-fry', '25 min · 2 srv · vegan', 1, 'HelloFresh'],
  chick: ['Crispy sesame chicken', '30 min · 4 srv · chinese', 1, 'Kitchen Sanctuary'],
  tacos: ['One-pan black bean tacos', '25 min · 2 srv · vegan', 0, 'HelloFresh'],
  gnocchi: ['Creamy tomato gnocchi', '20 min · 2 srv · vegetarian', 1, 'HelloFresh'],
  ginger: ['Sesame ginger chicken', '30 min · 2 srv · asian', 1, 'HelloFresh'],
  stew: ['Smoky chickpea stew', '35 min · 2 srv · vegan', 0, 'HelloFresh'],
  curry: ['Slow cooker beef curry', '6 hr 15 min · 6 srv · curry', 0, 'Kitchen Sanctuary'],
  dal: ['Coconut red lentil dal', '30 min · 4 srv · vegan', 1, ''],
};
const fresh = '<span class="text-text-secondary">Not saved yet</span>';
const rc = (k, ctx, saved, cls = '', showSrc = true) => card(RX[k][0], RX[k][1], ctx, saved, RX[k][2], showSrc ? RX[k][3] : '', cls);
const strip = (cards) => `<div class="nos flex gap-2.5 overflow-x-auto px-4 mt-3">${cards.join('')}</div>`;
const cc = 'w-[150px] min-w-[150px] shrink-0';           // carousel card
const ccLast = cc + ' opacity-70';                        // last card hints at scroll
const seeAll = (t = 'See all') => `<a href="#" class="shrink-0 min-h-[44px] inline-flex items-center text-[12px] text-olive">${t} →</a>`;
const sec = (t, sub = '', right = '', mt = 'mt-5') => `<div class="mx-4 ${mt} flex items-center justify-between gap-3"><div class="min-w-0"><h2 class="text-[15px] font-medium leading-[1.3]">${t}${dot}</h2>${sub ? `<p class="text-[12px] leading-[1.4] text-text-secondary">${sub}</p>` : ''}</div>${right}</div>`;

/* =====================================================================
   SCREEN 3 · Recipe detail
   ===================================================================== */
// steps[] with the ingredients whose step_index points at each one, and a duration when the text names one
const STEPS = [
  ['Rinse the jasmine rice, then simmer it in 1½ cups of salted water with the lid on for 15 minutes. Leave it covered off the heat.', ['¾ cup jasmine rice', 'salt'], 15, 'Rice'],
  ['Pat the tofu dry and cut it into bite-size cubes. Toss with the cornstarch and a pinch of salt until evenly coated.', ['14 oz firm tofu', '1 tbsp cornstarch', 'salt']],
  ['Trim the green beans and cut them in half. Slice the scallions, keeping whites and greens apart. Cut the lime into wedges.', ['6 oz green beans', '2 scallions', '1 lime']],
  ['Heat a drizzle of oil in a large pan over medium-high heat. Cook the tofu for 10 minutes, turning now and then, until golden and crisp on all sides.', ['cooking oil'], 10, 'Tofu'],
  ['Add the green beans and scallion whites. Cook for 4 minutes, then stir in the sweet chili sauce and soy sauce until everything is glossy.', ['3 tbsp sweet chili sauce', '1 tbsp soy sauce'], 4, 'Beans'],
  ['Fluff the rice and divide between bowls. Top with the tofu and beans, scallion greens, sesame seeds and a squeeze of lime.', ['1 tsp sesame seeds']],
];
const NUT = [['Calories', '610 kcal'], ['Protein', '24 g'], ['Carbohydrates', '82 g'], ['Fat', '19 g'], ['Fiber', '7 g'], ['Sodium', '980 mg']];
const STOCK = ['Jasmine rice', 'Soy sauce', 'Salt', 'Cooking oil'];
const qty = ([q, u]) => `${q}${u ? ' ' + u : ''}`;

const iconBtn = (n, on, label, tone = 'text-olive') => `<button aria-label="${label}" aria-pressed="${on}" class="w-11 h-11 flex items-center justify-center ${on ? tone : 'text-text-secondary'}">${ico(n, 'w-[22px] h-[22px]', on ? 'solid' : false)}</button>`;
const topBar = (saved, liked, title = '') => `<div class="px-2 pt-2 flex items-center"><a href="#" class="inline-flex items-center gap-1 h-11 px-2 text-olive text-[14px]">${ico('back','w-5 h-5')}${title ? '' : 'Recipes'}</a>${title ? `<p class="flex-1 min-w-0 truncate text-[15px] font-medium">${title}</p>` : '<span class="flex-1"></span>'}${iconBtn('heart', liked, liked ? 'Liked' : 'Like', 'text-mocha')}${iconBtn('bookmark', saved, saved ? 'Saved' : 'Save')}</div>`;
// on the Cook tab the right side of the top bar belongs to timers
const topBarCook = (right) => `<div class="px-2 pt-2 flex items-center gap-1"><a href="#" aria-label="Back" class="inline-flex items-center h-11 px-2 text-olive">${ico('back','w-5 h-5')}</a>${right}</div>`;
const tPill = (name, t, done = false) => `<button class="h-11 px-3 rounded-button-sm inline-flex items-center gap-1.5 text-[13px] font-medium ${done ? 'bg-mocha-light border border-mocha-border text-mocha-dark' : 'bg-cream-card border border-olive text-olive-dark'}">${ico(done ? 'check' : 'clock','w-4 h-4')}${name} ${t}</button>`;
const hpill = (t, tone = '') => `<span class="inline-flex items-center gap-1 text-[11px] rounded-tag px-2.5 py-1 ${tone || 'bg-cream-icon text-text-secondary'}">${t}</span>`;
const attribution = `<a href="#" class="inline-flex items-center gap-1 min-h-[44px] text-[12px] text-olive">From HelloFresh · view original ${ico('ext','w-3.5 h-3.5')}</a>`;
const tabBar = (on) => `<div class="sticky top-0 z-10 bg-cream border-b border-warm-border grid grid-cols-3 px-4" role="tablist">${['Ingredients', 'Cook & enjoy!', 'Nutrition'].map((t, i) => `<button role="tab" aria-selected="${i === on}" class="h-11 text-[14px] ${i === on ? 'text-olive-dark font-medium border-b-2 border-olive' : 'text-text-secondary'}">${t}</button>`).join('')}</div>`;
const servings = `<div class="mx-4 mt-4 flex items-end justify-between gap-3">
    <div><p class="text-[11px] text-text-secondary mb-1">Servings</p><div class="grid grid-cols-3 gap-1 p-1 bg-cream-icon rounded-button">${[2, 4, 6].map(n => `<button class="w-11 h-11 rounded-button-sm text-[14px] ${n === 2 ? 'bg-cream-card border border-warm-border text-olive-dark font-medium' : 'text-text-secondary'}">${n}</button>`).join('')}</div></div>
    <div><p class="text-[11px] text-text-secondary mb-1">Units</p><div class="flex gap-1 p-1 bg-cream-icon rounded-button">${['US', 'Metric'].map((t, i) => `<button class="px-3 min-w-[44px] h-11 rounded-button-sm text-[13px] ${i === 0 ? 'bg-cream-card border border-warm-border text-olive-dark font-medium' : 'text-text-secondary'}">${t}</button>`).join('')}</div></div></div>`;
const header = (saved, liked, pills, ratingLine) => `${topBar(saved, liked)}
  <div class="px-4"><h1 class="text-[26px] font-medium leading-[1.3]">${R.name}${dot}</h1>${attribution}
    <div class="flex flex-wrap gap-1.5">${pills}</div>${ratingLine}</div>
  <div class="mx-4 mt-4">${food('aspect-[4/3] w-full rounded-image-hero', 0)}</div>${servings}<div class="h-4"></div>`;
const dots5 = (val, live) => `<div class="flex gap-1" role="radiogroup" aria-label="Rating, 1 to 5">${[1, 2, 3, 4, 5].map(n => `<button ${live ? '' : 'disabled'} role="radio" aria-checked="${n === val}" class="w-11 h-11 shrink-0 rounded-full text-[14px] ${n <= val ? 'bg-olive text-cream-card font-medium' : live ? 'bg-cream-card border border-warm-btn-border text-text-primary' : 'bg-cream-icon text-text-muted'}">${n}</button>`).join('')}</div>`;
const ingTab = `<div class="mx-4 mt-4">${label('Ingredients · ' + ING.length)}
    <ul class="mt-1">${ING.map(([q, u, n, opt]) => { const s = STOCK.includes(n); return `<li class="flex items-center gap-2.5 py-2.5 border-b border-warm-divider last:border-0"><span class="w-1.5 h-1.5 rounded-full ${s ? 'bg-mocha' : 'bg-olive'}"></span><span class="flex-1 text-[14px]">${n}${opt ? ' <span class="text-tiny text-text-secondary bg-cream-pill rounded-pill px-1.5 py-0.5">optional</span>' : ''}</span>${s ? '<span class="text-[11px] text-olive-dark bg-cream-pill rounded-pill px-1.5 py-0.5">in stock</span>' : ''}<span class="w-[60px] text-right text-[13px] text-text-secondary">${qty([q, u])}</span></li>`; }).join('')}</ul>
    <a href="#" class="block mt-3 p-3 bg-cream-card border border-warm-border rounded-card"><span class="flex items-center justify-between"><span class="text-[13px] font-medium text-text-primary">Pantry check${dot}</span><span class="text-text-tertiary">${ico('chev','w-4 h-4')}</span></span><span class="block text-[13px] leading-normal text-text-secondary mt-1">4 ingredients are in stock. 7 are needed from the store.</span><span class="inline-flex items-center min-h-[44px] -mb-3 text-[13px] text-olive">Review and add missing →</span></a></div><div class="h-4"></div>`;
const bar = () => `<div class="mt-auto px-4 py-3 bg-cream border-t border-warm-border flex gap-2">${btn2(ico('check','w-[18px] h-[18px]') + 'I cooked this', 'text-[14px]')}${btn('Add to plan', 'flex-1')}</div>${nav().replace('mt-auto ', '')}`;
const quiet = (t) => `<p class="mt-3 text-[12px] leading-[1.4] text-text-tertiary">${t}</p>`;
const pTime = hpill('35 min'), pTags = R.tags.map(t => hpill(t)).join('');
const pFav = hpill(ico('heart','w-3 h-3','solid') + "In Sarah's favs", 'bg-mocha-light text-mocha-dark');
const pCooked = (n) => hpill('✓ Cooked ' + n + ' times', 'bg-cream-pill text-olive-dark');
const rated = `<p class="mt-3 text-[12px] leading-[1.4] text-text-secondary">Sarah rated it 4 of 5 · <a href="#" class="text-olive">change</a></p>`;
const regular = (n = 7) => `${header(true, true, pFav + pCooked(n) + pTime + pTags, rated)}${tabBar(0)}${ingTab}`;
const box = (on) => `<span class="w-5 h-5 shrink-0 rounded-[6px] flex items-center justify-center ${on ? 'bg-olive text-cream-card' : 'border border-text-muted'}">${on ? ico('check','w-3 h-3') : ''}</span>`;
const pRow = ([q, u, n], on) => `<li><label class="flex items-center gap-3 min-h-[44px] px-3 border-b border-warm-divider">${box(on)}<span class="flex-1 text-[14px]">${n}</span><span class="text-[12px] text-text-secondary">${qty([q, u])}</span></label></li>`;
const stepList = (running = false) => `<ol class="mx-4 mt-5 space-y-5">${STEPS.map(([t, pills, mins, name], i) => `<li class="flex gap-3"><span class="w-9 h-9 shrink-0 rounded-full bg-cream-icon text-olive-dark text-[15px] font-medium flex items-center justify-center">${i + 1}</span><div class="flex-1 pt-1"><p class="text-[15px] leading-[1.6]">${t}</p><div class="flex flex-wrap gap-1.5 mt-2">${pills.map(p => `<span class="text-[12px] bg-ingredient-pill-bg border border-warm-divider rounded-pill px-2 py-1">${p}</span>`).join('')}</div>${mins ? (running && i === 0 ? `<button class="mt-2 h-11 px-3 rounded-button-sm bg-mocha-light border border-mocha-border text-[13px] text-mocha-dark inline-flex items-center gap-1.5">${ico('check','w-4 h-4')}${name} is done</button>` : running && i === 3 ? `<button class="mt-2 h-11 px-3 rounded-button-sm bg-cream-card border border-olive text-[13px] font-medium text-olive-dark inline-flex items-center gap-1.5">${ico('clock','w-4 h-4')}8:42 left</button>` : `<button class="mt-2 h-11 px-3 rounded-button-sm bg-cream-card border border-warm-btn-border text-[13px] text-text-primary inline-flex items-center gap-1.5">${ico('clock','w-4 h-4')}Start ${mins} min</button>`) : ''}</div></li>`).join('')}</ol><div class="mx-4 mt-4 mb-2">${attribution}</div>`;
const idleBar = topBarCook(`<p class="flex-1 min-w-0 truncate text-[15px] font-medium">${R.name}</p><button class="h-11 px-3 rounded-button-sm bg-cream-card border border-warm-btn-border inline-flex items-center gap-1.5 text-[13px] text-text-primary">${ico('clock','w-4 h-4')}Timer</button>`);
const made = (who, when, score, text, v, friend = false) => `<li class="flex gap-3 p-3 bg-cream-card border border-warm-border rounded-card">${food('w-[84px] h-[84px] rounded-image-card shrink-0', v)}<div class="flex-1 min-w-0"><p class="flex items-center gap-1.5 text-[13px] font-medium">${who}${friend ? '<span class="text-tiny font-normal rounded-pill px-1.5 py-0.5 bg-mocha-light text-mocha-dark">Friend</span>' : ''}</p><p class="text-[11px] text-text-secondary">${when} · rated ${score} of 5</p><p class="text-[13px] leading-normal text-text-primary mt-1">${text}</p></div></li>`;

const sim = (t) => `<span class="text-text-secondary">${t}</span>`;
const DETAIL = [
  phone(1, 'Ingredients, not saved yet', 'Alex opens a recipe nobody has saved. Outline bookmark and heart up top. Rating is one muted line, no prompt.', `${header(false, false, hpill('Never cooked', 'bg-mocha-light text-mocha-dark') + pTime + pTags, quiet('Ratings open up after the first cook.'))}${tabBar(0)}${ingTab}${bar()}`),

  phone(2, 'Ingredients, a household regular', 'Saved, liked by Sarah, cooked 7 times. The pantry check is now a card that opens, not a one-tap add.', `${regular()}${bar()}`),

  phone(3, 'Pantry check, opened', 'Everything is visible before anything is added. Needed items start ticked; an in-stock item can be ticked too if it is running low.', `${regular()}${bar()}${dim(`
    <div class="px-4 pt-3 pb-4">
      <h2 class="text-[15px] font-medium">Pantry check${dot}</h2>
      <p class="text-[13px] leading-normal text-text-secondary mt-1">For 2 servings. Untick anything that doesn't need buying.</p>
      ${label('Needed · 7', 'mt-4')}
      <ul class="mt-2 bg-cream-card border border-warm-border rounded-card overflow-hidden">${ING.filter(i => !STOCK.includes(i[2])).map(i => pRow(i, true)).join('')}</ul>
      ${label('In stock · 4', 'mt-4')}
      <ul class="mt-2 bg-cream-card border border-warm-border rounded-card overflow-hidden">${ING.filter(i => STOCK.includes(i[2])).map(i => pRow(i, false)).join('')}</ul>
      ${btn('Add 7 to the list', 'w-full mt-4')}
      <button class="w-full h-11 text-[14px] text-text-secondary">Close</button>
    </div>`)}`, 'min-h-[1500px]'),

  phone(4, 'Just cooked', 'The count bumps, the rating is offered once, and one quiet link leads to a photo or a variation. "Not now" ends it.', `${regular(8)}
    <div class="mt-auto px-4 pt-3 pb-2 bg-cream-card border-t border-warm-border">
      <div class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-olive text-cream-card flex items-center justify-center">${ico('check','w-3 h-3')}</span><p class="flex-1 text-[14px] font-medium">Cooked 8 times now${dot}</p><a href="#" class="min-h-[44px] inline-flex items-center text-[13px] text-olive">Undo</a></div>
      <p class="text-[13px] text-text-secondary">How was it tonight, Alex?</p>
      <div class="mt-2 flex items-center justify-between">${dots5(0, true)}<button class="h-11 px-2 text-[13px] text-text-secondary">Not now</button></div>
      <a href="#" class="inline-flex items-center gap-1.5 min-h-[44px] text-[13px] text-olive">${ico('camera','w-4 h-4')}Add a photo or a variation</a>
    </div>${nav().replace('mt-auto ', '')}`),

  phone(5, 'Photo and variation', 'All optional, saved together. The variation is free text for now, so "swapped X for Y" stays in the cook\'s own words.', `${regular(8)}${bar()}${dim(`
    <div class="px-4 pt-3 pb-4">
      <h2 class="text-[15px] font-medium">Tonight's cook${dot}</h2>
      <div class="mt-3">${dots5(5, true)}</div>
      ${label('Photo', 'mt-4')}
      <div class="mt-2 flex gap-2">${food('w-[104px] h-[104px] rounded-image-card', 1)}<button class="w-[104px] h-[104px] rounded-image-card border border-dashed border-warm bg-cream-card flex flex-col items-center justify-center gap-1 text-olive text-[12px]">${ico('camera','w-5 h-5')}Add another</button></div>
      ${label('What changed', 'mt-4')}
      <div class="mt-2 min-h-[88px] p-3 rounded-input border border-warm-border bg-cream-card text-[14px] leading-normal">Swapped the green beans for broccoli and doubled the chili sauce.</div>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-2">Shown to the household under "How it turned out".</p>
      ${btn('Save', 'w-full mt-4')}
      <button class="w-full h-11 text-[14px] text-text-secondary">Not now</button>
    </div>`)}`),

  phone(6, 'How it turned out, then similar recipes', 'Under the tab content on every tab, reached by scrolling. Photos, ratings and variations first, then a row of near neighbours, each saying why it is there.', `${topBar(true, true, R.name)}${tabBar(0)}
    ${sec('How it turned out', 'Cooked 8 times · 3 with photos', seeAll())}
    <ul class="mx-4 mt-3 space-y-2">
      ${made('Alex', 'Tonight', 5, 'Swapped the green beans for broccoli and doubled the chili sauce.', 1)}
      ${made('Sarah', 'Oct 28', 4, 'Air-fried the tofu, 12 minutes at 400°F. Crispier, less oil.', 0)}
      ${made('Priya', 'Oct 12', 5, 'Added a fried egg on top for the non-vegans.', 1, true)}
    </ul>
    ${sec('Similar recipes', 'Close on ingredients and tags', seeAll())}${strip([rc('noodle', sim('Shares 6 ingredients'), true, cc), card('Crispy chilli tofu', '25 min · 4 srv · vegan', sim('Shares 5 ingredients'), false, 1, 'Kitchen Sanctuary', cc), rc('stew', sim('Also vegan, same time'), false, ccLast)])}
    <div class="h-4"></div>${bar()}`),

  phone(7, 'Cook & enjoy!, timer idle', 'On this tab the heart and bookmark give way to a timer button. Ingredient pills sit under each step, and steps that name a time offer to start it.', `${idleBar}${tabBar(1)}${stepList()}${bar()}`),

  phone(8, 'Setting a timer', 'Opens from the top bar or from a step. Name, time and quick amounts are all editable before it starts.', `${idleBar}${tabBar(1)}${stepList()}${bar()}${dim(`
    <div class="px-4 pt-3 pb-4">
      <h2 class="text-[15px] font-medium">New timer${dot}</h2>
      ${label('Name', 'mt-4')}
      <div class="mt-2 h-12 flex items-center px-3 rounded-input border border-warm-border bg-cream-card text-[14px]">Tofu</div>
      <div class="mt-4 flex items-center justify-between"><button aria-label="One minute less" class="w-12 h-12 rounded-full bg-cream-card border border-warm-btn-border flex items-center justify-center">${ico('minus')}</button><p class="text-[26px] font-medium">10:00</p><button aria-label="One minute more" class="w-12 h-12 rounded-full bg-cream-card border border-warm-btn-border flex items-center justify-center">${ico('plus')}</button></div>
      <div class="mt-4 grid grid-cols-4 gap-2">${[5, 10, 15, 20].map(n => `<button class="h-11 rounded-button-sm text-[13px] ${n === 10 ? 'bg-olive text-cream-card font-medium' : 'bg-cream-card border border-warm-btn-border text-text-primary'}">${n} min</button>`).join('')}</div>
      ${btn('Start timer', 'w-full mt-4')}
      <button class="w-full h-11 text-[14px] text-text-secondary">Cancel</button>
    </div>`)}`),

  phone(9, 'Timers running', 'The top bar stays put while the steps scroll, so the countdowns are always in view. A finished timer turns mocha until it is tapped away.', `${topBarCook(`<div class="nos flex-1 flex gap-1.5 overflow-x-auto">${tPill('Rice', '· done', true)}${tPill('Tofu', '8:42')}</div><button aria-label="Add a timer" class="w-11 h-11 shrink-0 rounded-button-sm bg-cream-card border border-warm-btn-border flex items-center justify-center text-olive">${ico('plus')}</button>`)}${tabBar(1)}${stepList(true)}${bar()}`),

  phone(10, 'Nutrition, from the source', 'Whatever the source provided, per serving, with a line saying where the numbers came from.', `${topBar(true, true, R.name)}${tabBar(2)}
    <div class="mx-4 mt-4">${label('Per serving')}
      <ul class="mt-2 px-3 bg-cream-card border border-warm-border rounded-card">${NUT.map(([k, v]) => `<li class="flex justify-between py-3 border-b border-warm-divider last:border-0 text-[14px]"><span>${k}</span><span class="text-text-secondary">${v}</span></li>`).join('')}</ul>
      <p class="text-[12px] leading-[1.4] text-text-secondary mt-3">As provided by HelloFresh for 2 servings.</p>
    </div>${bar()}`),

  phone(11, 'Nutrition, estimated (proposal)', 'When the source gives nothing: an estimate from the ingredients, labelled as one. Ingredients with no amount are worked out at two sample sizes, which gives a range.', `${topBar(true, false, 'Crispy sesame chicken')}${tabBar(2)}
    <div class="mx-4 mt-4"><div class="flex items-center justify-between">${label('Per serving')}<span class="text-tiny font-medium rounded-pill px-1.5 py-1 bg-mocha-light text-mocha-dark">Estimated</span></div>
      <ul class="mt-2 px-3 bg-cream-card border border-warm-border rounded-card">${[['Calories', '540 to 660 kcal'], ['Protein', 'about 34 g'], ['Carbohydrates', 'about 48 g'], ['Fat', '22 to 36 g'], ['Sodium', '700 to 1,300 mg']].map(([k, v]) => `<li class="flex justify-between py-3 border-b border-warm-divider last:border-0 text-[14px]"><span>${k}</span><span class="text-text-secondary">${v}</span></li>`).join('')}</ul>
      <div class="mt-3">${note('No amount was given for salt or frying oil, so those are worked out at a light and a generous amount. That is where the ranges come from.')}</div>
    </div>${bar()}`),
];

document.getElementById('app').innerHTML =
  section('detail', 'Recipe detail', 'Bookmark and heart live in the top bar, except on Cook & enjoy!, where timers take their place. "I cooked this" and "Add to plan" stay pinned to the bottom.', DETAIL);

</script>
</body>
</html>
